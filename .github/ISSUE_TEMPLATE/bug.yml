name: Bug report
description: Something in Bakery doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Before pasting output, remove repository paths, card text or secrets you don't want public.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bakery version
      description: Shown in Settings, or run `bakery-cli --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `bakery-cli doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Open Logs (press `g l`) and paste the lines around the problem.
      render: text
