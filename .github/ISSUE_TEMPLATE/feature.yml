name: Feature request
description: Suggest an improvement to Alice.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Workarounds or existing features you used, and where they fell short.
    validations:
      required: true
