name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests run only the tests their changes need (scripts/ci-changes.mjs). Pushes to main run everything.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.plan.outputs.test }}
      os: ${{ steps.plan.outputs.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node scripts/ci-changes.mjs >> "$GITHUB_OUTPUT"
          else
            echo 'test=true' >> "$GITHUB_OUTPUT"
            echo 'os=["ubuntu-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: test (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.test == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows runs only on the branch of the card making the suite pass there (1eeec26c), so other PRs aren't sent
        # back for its known failures. Put windows-latest back in the plain list once that card merges.
        os: ${{ fromJSON(github.head_ref == 'bakery/1eeec26c-f631-4c9c-8e8d-559d80c983dd' && '["ubuntu-latest","macos-latest","windows-latest"]' || needs.plan.outputs.os) }}
    steps:
      # Keep LF line endings on Windows so `oxfmt --check` in the build matches Linux.
      - run: git config --global core.autocrlf false
      # Tests create temporary Git repositories and commit in them.
      - run: |
          git config --global user.name "Bakery CI"
          git config --global user.email "ci@bakery.invalid"
          git config --global init.defaultBranch main
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # UI tests drive Chromium through Playwright, and WebKit on macOS (see tests/setup.ts).
      - run: npx playwright install --with-deps chromium
      - if: runner.os == 'macOS'
        run: npx playwright install webkit
      - run: npm test
      - run: npm run build
